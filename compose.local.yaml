services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartpalm_ingestion
      POSTGRES_USER: smartpalm_ingestion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT:-5436}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpalm_ingestion -d smartpalm_ingestion"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["ingestion-postgres:/var/lib/postgresql/data"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["isolated"]
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
  ingestion-api:
    build: { context: . }
    profiles: ["api"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IngestionDatabase: Host=postgres;Port=5432;Database=smartpalm_ingestion;Username=smartpalm_ingestion;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: smartpalm.identity
      Jwt__Audience: smartpalm.clients
      Jwt__Key: ${JWT_KEY}
      RabbitMq__Enabled: "true"
      RabbitMq__Uri: ${RABBITMQ_URI:-amqp://guest:guest@host.docker.internal:5672/}
    ports: ["${INGESTION_API_PORT:-5104}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
volumes: { ingestion-postgres: {} }
