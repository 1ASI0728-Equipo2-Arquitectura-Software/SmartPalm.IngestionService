services:
  postgres:
    image: postgres:17-alpine
    profiles: ["isolated"]
    environment:
      POSTGRES_DB: smartpalm_ingestion
      POSTGRES_USER: smartpalm_ingestion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-postgres-password}
    ports: ["${POSTGRES_PORT:-5436}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartpalm_ingestion -d smartpalm_ingestion"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["ingestion-postgres:/var/lib/postgresql/data"]
  rabbitmq:
    image: rabbitmq:4-management-alpine
    profiles: ["isolated"]
    ports: ["${RABBITMQ_PORT:-5672}:5672", "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
  ingestion-api:
    build: { context: . }
    profiles: ["api"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IngestionDatabase: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Port=5432;Database=smartpalm_ingestion;Username=smartpalm_ingestion;Password=replace-with-a-local-postgres-password}
      Jwt__Issuer: ${JWT_ISSUER:-smartpalm.identity}
      Jwt__Audience: ${JWT_AUDIENCE:-smartpalm.clients}
      Jwt__Key: ${JWT_KEY}
      RabbitMq__Enabled: "true"
      RabbitMq__Uri: ${RABBITMQ_URI:-amqp://guest:guest@rabbitmq:5672/}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE:-smartpalm.events}
      RabbitMq__Queue: ${RABBITMQ_QUEUE:-smartpalm.ingestion}
    ports: ["${INGESTION_API_PORT:-5104}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
        required: false
volumes: { ingestion-postgres: {} }
